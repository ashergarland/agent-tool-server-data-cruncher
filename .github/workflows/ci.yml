name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Agent Tool Platform workflow pin:
  # 98ec8162fb11d5c04aee9e6f7b3625a472a0180d
  capability:
    permissions:
      contents: read
    uses: ashergarland/agent-tool-platform/.github/workflows/capability-ci.yml@98ec8162fb11d5c04aee9e6f7b3625a472a0180d
    with:
      node_version: '22'
      openapi_path: openapi.json
      run_package_smoke: true

  deployment-contract:
    name: Deployment contract
    needs: capability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the exact Platform contract revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ashergarland/agent-tool-platform
          ref: 98ec8162fb11d5c04aee9e6f7b3625a472a0180d
          path: .agent-tool-platform

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .agent-tool-platform/package-lock.json

      - name: Build the pinned Platform checkout
        working-directory: .agent-tool-platform
        run: |
          npm ci
          npm run build

      - name: Validate the public profile declaration
        env:
          AGENT_TOOL_PLATFORM_CHECKOUT: ${{ github.workspace }}/.agent-tool-platform
        run: npm run deployment:validate

      - name: Run deployment-contract conformance
        env:
          AGENT_TOOL_PLATFORM_CHECKOUT: ${{ github.workspace }}/.agent-tool-platform
        run: npm run deployment:conformance
